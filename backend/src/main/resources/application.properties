spring.application.name=backend
server.port=8081

# ===== DataSource (MySQL) =====
spring.datasource.url=jdbc:mysql://localhost:3306/AuctionSite?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=utf8&useUnicode=true
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ===== OAuth2 Client (Google) =====
spring.security.oauth2.client.registration.google.client-id = ${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret = ${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.google.client-authentication-method=client_secret_basic
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code

# Provider mapping (quan trọng để lấy "sub" làm id)
spring.security.oauth2.client.provider.google.user-name-attribute=sub

# ===== App configs =====
app.jwt.secret=${APP_JWT_SECRET}
app.frontend.callback=http://localhost:5174/auth/callback

# thư mục thật trên máy chủ để lưu file
app.upload.dir=${APP_UPLOAD_DIR}

# (tùy chọn) giới hạn size
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Email Configuration
spring.mail.host=${EMAIL_HOST}
spring.mail.port=${EMAIL_PORT}
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# =========================
# GEMINI API CONFIG
# =========================
gemini.api.base-url=https://generativelanguage.googleapis.com/v1
gemini.api.key=${GEMINI_API_KEY}
gemini.model.chat=gemini-2.5-flash

# =========================
# Generation defaults
# =========================
gemini.generation.temperature=0.7
gemini.generation.top-p=0.95
gemini.generation.top-k=40
gemini.generation.max-output-tokens=2048

# =========================
# STRIPE TEST MODE CONFIG
# =========================
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY}
stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}

# (optional) currency & base url
stripe.currency=vnd
stripe.success-url=http://localhost:5174/dashboard/user/wallet
stripe.cancel-url=http://localhost:5174/dashboard/user/wallet

# =========================
# CHATBOT CONFIG
# =========================
chatbot.history.max-items=6
chatbot.cache.ttl-minutes=30
chatbot.rate-limit.requests-per-minute=30
chatbot.rate-limit.enabled=true