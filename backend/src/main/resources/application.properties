spring.application.name=backend
server.port=8081

# ===== DataSource (MySQL) =====
spring.datasource.url=jdbc:mysql://localhost:3306/AuctionSite?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8&useUnicode=true
