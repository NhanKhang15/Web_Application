services:
  mysql:
    image: mysql:8.0
    container_name: webapp-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=1234567
      - MYSQL_DATABASE=AuctionSite
    ports:
      - "3307:3306"       
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p1234567"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: webapp-backend
    depends_on:
      - mysql               # đơn giản: đợi service mysql lên (không cần condition)
    environment:
      - SERVER_PORT=8081
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/AuctionSite?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=utf8&useUnicode=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=1234567
      - APP_UPLOAD_DIR=/app/uploads
      - APP_JWT_SECRET = K2z9Xn4pQa7wLm0dR8s1Yc5vUf3hJt6B
      - GOOGLE_CLIENT_ID= 121748365089-p45l8p0u1s6u5vmbtd0vv0fasf99q22t.apps.googleusercontent.com
      - GOOGLE_CLIENT_SECRET= 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
      - APP_FRONTEND_CALLBACK=http://localhost:5173/auth/callback
      # - JAVA_OPTS=-Xms256m -Xmx512m
    ports:
      - "8081:8081"
    volumes:
      - ./uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile  
    container_name: webapp-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  db_data:
